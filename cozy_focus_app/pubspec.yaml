name: cozy_focus_app
description: Cozy Focus — a mindful productivity companion.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.3.0

  # Local database
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  # Remote / sync
  supabase_flutter: ^2.8.1

  # Animation
  rive: ^0.13.17

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^6.1.1
  wakelock_plus: ^1.2.10
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.1
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14
  riverpod_generator: ^2.6.1
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  mockito: ^5.4.5
  test: ^1.25.14
  fake_async: ^1.3.2

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/images/
    - assets/sounds/

